name: dispatch_console_flutter
description: Flutter conversion of the ERAS dispatch console demo.
publish_to: none

version: 1.0.0+1

environment:
  # 3.4.0 is the first SDK that ships the dart:js_interop `isA` helper used by
  # lib/services/location_service_web.dart for platform-consistent JS type
  # checks.
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  socket_io_client: ^2.0.3
  geolocator: ^13.0.2
  google_maps_flutter: ^2.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
