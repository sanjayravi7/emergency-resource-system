name: dispatch_console_flutter
description: Flutter conversion of the ERAS dispatch console demo.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  socket_io_client: ^2.0.3
  geolocator: ^13.0.2
  google_maps_flutter: ^2.18.1
  url_launcher: ^6.3.1
  # FCM push notifications for backgrounded responders. Socket.IO stays the
  # foreground realtime channel; push only covers responders whose app is not
  # currently maintaining a Socket.IO connection. Runs as a silent no-op when
  # no Firebase configuration is present (see lib/services/push_notification_service.dart).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
