<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ERAS — Emergency Resource Allocation System: emergency request, responder and resource coordination console.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- Installed-app name on iOS: must match web/manifest.json. -->
  <meta name="apple-mobile-web-app-title" content="ERAS Console">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Browser title / installed PWA name. Keep the manifest in sync. -->
  <title>ERAS — Emergency Resource Allocation System</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0175C2">

  <!--
    Google Identity Services client library.

    google_sign_in's web plugin (registered by Flutter on every web build)
    drives google.accounts.id / google.accounts.oauth2 and loads this script
    itself. Declaring it here only starts the download earlier. It is served by
    Google, is versioned by Google, and contains no project secret.

    ERAS's own web Google sign-in does NOT depend on it: Flutter Web
    authenticates through Firebase Auth's Google popup/redirect flow, so an
    unreachable CDN (ad blocker, strict privacy mode) cannot break Google
    registration on the deployed site.
  -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Google Maps for Flutter Web uses the Maps JavaScript API.
    //
    // Development setup:
    //   1. Copy web/google_maps_config.template.js to web/google_maps_config.js.
    //   2. Put a referrer-restricted Maps JavaScript API key in that local file.
    //   3. Keep google_maps_config.js uncommitted.
    (function () {
      function startFlutter() {
        var flutterScript = document.createElement('script');
        flutterScript.src = 'flutter_bootstrap.js';
        flutterScript.async = true;
        document.body.appendChild(flutterScript);
      }

      // ------------------------------------------------------------------
      // Firebase JS SDK (compat build).
      //
      // FlutterFire's web plugins (firebase_core / firebase_auth /
      // firebase_messaging) talk to the global `firebase` namespace, so the
      // SDK must be present before Flutter starts. Google sign-in and web push
      // therefore needs NO secrets here: the project configuration is supplied
      // at build time with --dart-define (see lib/services/firebase_bootstrap.dart)
      // and the Google *web* client id is a public OAuth client id.
      //
      // Loading is best-effort: if the CDN is unreachable, email/password
      // login and every emergency workflow keep working and Google sign-in
      // reports "not configured" instead of failing the app.
      // ------------------------------------------------------------------
      var FIREBASE_JS_VERSION = '9.23.0';
      var FIREBASE_JS_FILES = [
        'firebase-app-compat.js',
        'firebase-auth-compat.js',
        'firebase-messaging-compat.js'
      ];

      function loadFirebaseSdk(done) {
        // Sequential on purpose: the compat builds must be evaluated in order
        // (auth/messaging extend the app namespace registered by
        // firebase-app-compat.js). Loading is still asynchronous, so the page
        // stays responsive.
        var index = 0;

        function next() {
          if (index >= FIREBASE_JS_FILES.length) {
            done();
            return;
          }

          var file = FIREBASE_JS_FILES[index++];
          var script = document.createElement('script');
          script.src =
            'https://www.gstatic.com/firebasejs/' +
            FIREBASE_JS_VERSION + '/' + file;
          script.onload = next;
          script.onerror = function () {
            console.warn('[ERAS] ' + file + ' failed to load; the matching ' +
              'Firebase feature stays disabled until it is reachable.');
            next();
          };
          document.head.appendChild(script);
        }

        next();
      }

      function loadLocationBridge(done) {
        var bridgeScript = document.createElement('script');
        bridgeScript.src = 'eras_location_bridge.js';
        bridgeScript.onload = done;
        bridgeScript.onerror = function () {
          console.error('ERAS location bridge failed to load.');
          done();
        };
        document.head.appendChild(bridgeScript);
      }

      // Never prints the key: only its length and last 4 characters, so the
      // key actually used at runtime can be matched against Google Cloud
      // without leaking it into logs or screenshots.
      function maskKey(key) {
        var text = String(key || '');
        if (text.length <= 4) return '****';
        return '****' + text.slice(-4);
      }

      function configureGoogleMaps() {
        var key = window.ERAS_GOOGLE_MAPS_API_KEY;

        // Diagnostics snapshot (read by web/eras_location_bridge.js and
        // web/eras_location_diagnostics.html). No secret is stored here.
        window.ERAS_MAPS_RUNTIME = {
          keyConfigured: !!key,
          keyMasked: key ? maskKey(key) : null,
          keyLength: key ? String(key).length : 0,
          keySource: 'web/google_maps_config.js',
          origin: window.location.origin,
          href: window.location.href,
          libraries: 'places',
          loaderUrl: null,
          loadedAt: new Date().toISOString()
        };

        // Google calls this global when the browser key itself is rejected
        // (InvalidKeyMapError, RefererNotAllowedMapError, ApiNotActivated...).
        // The failure is recorded and printed with the exact page origin that
        // has to be allow-listed as an HTTP referrer.
        window.gm_authFailure = function () {
          window.ERAS_MAPS_AUTH_FAILURE = true;
          console.error(
            '[ERAS] Google Maps authentication failure (gm_authFailure). ' +
            'Key ' + (window.ERAS_MAPS_RUNTIME.keyMasked || '(missing)') +
            ' was rejected for origin ' + window.location.origin + '. ' +
            'Add ' + window.location.origin + '/* to the key HTTP referrers ' +
            'and make sure Maps JavaScript API and Places API (New) are ' +
            'enabled and allowed by the key restrictions.'
          );
        };

        if (!key) {
          console.warn(
            'ERAS Google Maps API key not configured. Copy web/google_maps_config.template.js ' +
            'to web/google_maps_config.js and set ERAS_GOOGLE_MAPS_API_KEY.'
          );
          startFlutter();
          return;
        }

        // google_maps_flutter_web accesses the Maps JavaScript API through
        // the global google.maps namespace (including MapTypeId.ROADMAP).
        // Load the complete Maps JavaScript API before Flutter starts. The
        // importLibrary bootstrap only installs a lazy import function; it does
        // not populate google.maps.MapTypeId until application code imports the
        // maps library, which this platform implementation does not do.
        var mapsScript = document.createElement('script');
        mapsScript.async = true;
        mapsScript.src =
          'https://maps.googleapis.com/maps/api/js?key=' +
          encodeURIComponent(key) +
        // The places library powers the requester place autocomplete and the
        // Nearby Search (New) selector in web/eras_location_bridge.js.
        '&libraries=places&v=weekly';
        window.ERAS_MAPS_RUNTIME.loaderUrl =
          mapsScript.src.replace(/key=[^&]*/, 'key=' + maskKey(key));
        console.info(
          '[ERAS] Google Maps JS loading with key ' + maskKey(key) +
          ' (' + String(key).length + ' chars) from origin ' +
          window.location.origin +
          '. Required on this key: Maps JavaScript API, Places API (New), ' +
          'Open /eras_location_diagnostics.html to test them.'
        );
        mapsScript.onload = function () {
          loadLocationBridge(startFlutter);
        };
        mapsScript.onerror = function () {
          console.error('ERAS Google Maps JavaScript API failed to load.');
          startFlutter();
        };
        document.head.appendChild(mapsScript);
      }

      var configScript = document.createElement('script');
      configScript.src = 'google_maps_config.js';
      configScript.onload = loadFirebaseSdk(configureGoogleMaps);
      configScript.onerror = loadFirebaseSdk(configureGoogleMaps);
      document.head.appendChild(configScript);
    })();
  </script>
</body>
</html>
