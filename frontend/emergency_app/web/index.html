<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ERAS — Emergency Resource Allocation System: emergency request, responder and resource coordination console.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- Installed-app name on iOS: must match web/manifest.json. -->
  <meta name="apple-mobile-web-app-title" content="ERAS Console">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Browser title / installed PWA name. Keep the manifest in sync. -->
  <title>ERAS — Emergency Resource Allocation System</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0175C2">

  <style>
    #eras-maps-status[hidden] { display: none; }
    #eras-maps-status {
      position: fixed;
      z-index: 2147483647;
      top: 12px;
      left: 12px;
      right: 12px;
      box-sizing: border-box;
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 16px;
      border: 1px solid #f0c36d;
      border-radius: 8px;
      background: #fff7e6;
      color: #493512;
      box-shadow: 0 4px 18px rgba(14, 27, 48, .18);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
  </style>

  <!--
    Google Identity Services client library.

    google_sign_in's web plugin (registered by Flutter on every web build)
    drives google.accounts.id / google.accounts.oauth2 and loads this script
    itself. Declaring it here only starts the download earlier. It is served by
    Google, is versioned by Google, and contains no project secret.

    ERAS's own web Google sign-in does NOT depend on it: Flutter Web
    authenticates through Firebase Auth's Google popup/redirect flow, so an
    unreachable CDN (ad blocker, strict privacy mode) cannot break Google
    registration on the deployed site.
  -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- The one shared, idempotent Maps API loader used by the app/diagnostics. -->
  <script src="eras_google_maps_loader.js"></script>
</head>
<body>
  <div id="eras-maps-status" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <script>
    // Keep Firebase, Maps, the location bridge, and Flutter startup idempotent.
    // In particular, assign functions to the config script's events: invoking
    // loadFirebaseSdk() while assigning onload/onerror starts two Firebase
    // chains, and each chain used to inject a second Maps API script.
    (function () {
      var startupPromise = null;
      var firebaseSdkPromise = null;
      var locationBridgePromise = null;
      var mapsInitializationPromise = null;
      var flutterStarted = false;

      function startFlutter() {
        if (flutterStarted) return;
        flutterStarted = true;
        var flutterScript = document.createElement('script');
        flutterScript.src = 'flutter_bootstrap.js';
        flutterScript.async = true;
        document.body.appendChild(flutterScript);
      }

      // Firebase JS SDK (compat build). Keep its existing best-effort,
      // sequential loading behavior for Firebase Auth and messaging.
      var FIREBASE_JS_VERSION = '9.23.0';
      var FIREBASE_JS_FILES = [
        'firebase-app-compat.js',
        'firebase-auth-compat.js',
        'firebase-messaging-compat.js'
      ];

      function loadFirebaseSdk() {
        if (firebaseSdkPromise) return firebaseSdkPromise;

        firebaseSdkPromise = new Promise(function (resolve) {
          var index = 0;

          function next() {
            if (index >= FIREBASE_JS_FILES.length) {
              resolve();
              return;
            }

            var file = FIREBASE_JS_FILES[index++];
            var script = document.createElement('script');
            script.src =
              'https://www.gstatic.com/firebasejs/' +
              FIREBASE_JS_VERSION + '/' + file;
            script.onload = next;
            script.onerror = function () {
              console.warn('[ERAS] ' + file + ' failed to load; the matching ' +
                'Firebase feature stays disabled until it is reachable.');
              next();
            };
            document.head.appendChild(script);
          }

          next();
        });
        return firebaseSdkPromise;
      }

      function loadLocationBridge() {
        if (locationBridgePromise) return locationBridgePromise;

        locationBridgePromise = new Promise(function (resolve) {
          var bridgeScript = document.createElement('script');
          bridgeScript.src = 'eras_location_bridge.js';
          bridgeScript.onload = resolve;
          bridgeScript.onerror = function () {
            console.error('[ERAS] Location bridge failed to load.');
            resolve();
          };
          document.head.appendChild(bridgeScript);
        });
        return locationBridgePromise;
      }

      function maskKey(key) {
        var text = String(key || '');
        return text.length > 4 ? '****' + text.slice(-4) : '****';
      }

      function showMapsUnavailable(error) {
        var loader = window.erasGoogleMapsLoader;
        var code = error && error.code ? String(error.code) : 'LOAD_FAILED';
        var status = document.getElementById('eras-maps-status');
        var message = loader && typeof loader.getUserMessage === 'function'
          ? loader.getUserMessage(error)
          : 'Maps and place search are temporarily unavailable. Please contact ERAS support.';

        window.ERAS_MAPS_STATUS = { available: false, errorCode: code };
        if (status) {
          status.textContent = message;
          status.hidden = false;
          status.setAttribute('data-error-code', code);
        }
        // Never include the browser key or raw script URL in console output.
        console.error(
          '[ERAS] Google Maps initialization failed (' + code + ') for origin ' +
          window.location.origin + '. Check the active browser key, its HTTP ' +
          'referrer restrictions, and Maps JavaScript API / Places API (New) authorization.'
        );
      }

      function initializeGoogleMaps() {
        if (mapsInitializationPromise) return mapsInitializationPromise;

        var key = window.ERAS_GOOGLE_MAPS_API_KEY;
        var loader = window.erasGoogleMapsLoader;
        var masked = key ? maskKey(key) : null;
        var validKey = !!(loader && loader.isValidKey && loader.isValidKey(key));

        window.ERAS_MAPS_RUNTIME = {
          keyConfigured: !!key,
          keySyntaxValid: validKey,
          keyMasked: masked,
          keyLength: key ? String(key).length : 0,
          keySource: 'ERAS_GOOGLE_MAPS_API_KEY',
          origin: window.location.origin,
          href: window.location.href,
          libraries: 'maps,places',
          loaderUrl: null,
          loadedAt: new Date().toISOString()
        };

        // Google calls gm_authFailure when a key is inactive, invalid, or
        // rejected by its HTTP-referrer/API restrictions. Keep diagnostics
        // actionable while showing users a safe message that contains no key.
        window.gm_authFailure = function () {
          window.ERAS_MAPS_AUTH_FAILURE = true;
          showMapsUnavailable({ code: 'GOOGLE_MAPS_AUTH_FAILURE' });
        };

        mapsInitializationPromise = Promise.resolve().then(function () {
          if (!loader || typeof loader.ensureLoaded !== 'function') {
            var missingLoader = new Error('The ERAS Maps loader did not load.');
            missingLoader.code = 'LOADER_UNAVAILABLE';
            throw missingLoader;
          }
          return loader.ensureLoaded(key);
        }).then(function () {
          var diagnostics = loader.getDiagnostics();
          window.ERAS_MAPS_RUNTIME.loaderUrl = diagnostics.scriptUrl;
          window.ERAS_MAPS_STATUS = {
            available: !window.ERAS_MAPS_AUTH_FAILURE,
            authFailure: !!window.ERAS_MAPS_AUTH_FAILURE
          };
        }, function (error) {
          showMapsUnavailable(error);
        }).then(function () {
          return loadLocationBridge();
        }).then(function () {
          startFlutter();
        });

        return mapsInitializationPromise;
      }

      function startApplication() {
        if (startupPromise) return startupPromise;
        startupPromise = loadFirebaseSdk()
          .then(initializeGoogleMaps)
          .catch(function (error) {
            // A Maps/config failure must not prevent ERAS or Firebase Auth from
            // starting. The location controls retain a safe fallback message.
            showMapsUnavailable(error);
            return loadLocationBridge();
          })
          .then(startFlutter);
        return startupPromise;
      }

      // The build helper creates this ignored static file from the
      // ERAS_GOOGLE_MAPS_API_KEY environment variable. Local development can
      // create it from google_maps_config.template.js.
      var configScript = document.createElement('script');
      configScript.src = 'google_maps_config.js';
      configScript.onload = startApplication;
      configScript.onerror = function () {
        window.__erasMapsConfigMissing = true;
        startApplication();
      };
      document.head.appendChild(configScript);
    })();
  </script>
</body>
</html>
