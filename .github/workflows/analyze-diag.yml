# TEMPORARY DIAGNOSTIC WORKFLOW - not part of the ERAS delivery.
#
# The Flutter job's log archive is unreachable from this environment, so this
# workflow re-runs the same two commands as `.github/workflows/dart.yml`
# (`flutter analyze` and `flutter test`) and republishes their output as check
# annotations, which ARE reachable. It never fails the build, and it is deleted
# once the output has been read.
name: Analyze diagnostics (temporary)

on:
  push:
    branches: ["arena/01a0f9c9-emergency-resource-system"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (annotated)
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/analyze.log >/dev/null
          python3 - <<'PY'
          import os, re, subprocess

          def publish(path, prefix, limit_lines=4000, chunk=2800, max_chunks=24):
              try:
                  text = open(path, encoding='utf-8', errors='replace').read()
              except OSError:
                  return
              lines = text.splitlines()[:limit_lines]
              text = '\n'.join(lines)
              if not text.strip():
                  return
              print(f'--- {prefix}: {len(lines)} lines, {len(text)} chars')
              for i in range(0, len(text), chunk):
                  part = text[i:i + chunk].replace('%', '%25').replace('\n', '%0A')
                  n = i // chunk + 1
                  print(f'::error title={prefix}-{n}::{part}')

          # Keep only the analyzer lines so the annotation budget is spent on
          # findings, not on progress output.
          keep = []
          for line in open('/tmp/analyze.log', encoding='utf-8', errors='replace'):
              if re.search(r'\b(error|warning|info)\b\s+•', line) or 'issues found' in line or 'No issues' in line:
                  keep.append(line.rstrip())
          open('/tmp/analyze.findings', 'w').write('\n'.join(keep))
          publish('/tmp/analyze.findings', 'analyze')
          PY
          exit 0

      - name: Test (annotated)
        run: |
          set +e
          flutter test --reporter json > /tmp/test.json 2>/tmp/test.err
          python3 - <<'PY'
          import json

          names = {}
          failures = []
          prints = {}
          for line in open('/tmp/test.json', encoding='utf-8', errors='replace'):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  event = json.loads(line)
              except ValueError:
                  continue
              kind = event.get('type')
              if kind == 'testStart':
                  names[event['test']['id']] = event['test'].get('name')
              elif kind == 'print':
                  prints.setdefault(event.get('testID'), []).append(event.get('message', ''))
              elif kind == 'error':
                  failures.append((event.get('testID'), names.get(event.get('testID'), '?'), event.get('error', '')))

          blocks = []
          for test_id, name, error in failures:
              details = []
              for line in error.splitlines():
                  if line.strip():
                      details.append(line.rstrip())
              # The actionable assertion text is printed by the framework, not
              # carried in the error event.
              for message in prints.get(test_id, [])[-40:]:
                  for line in message.splitlines():
                      if any(k in line for k in ('Expected', 'Actual', 'Which', 'EXCEPTION', 'The following', 'was thrown', 'at ')):
                          details.append(line.rstrip())
              seen = set()
              unique = []
              for line in (details or ['(no detail reported)']):
                  if line not in seen:
                      seen.add(line)
                      unique.append(line[:220])
              blocks.append('● ' + str(name) + '\n' + '\n'.join('   ' + l for l in unique[:24]))
          text = '\n'.join(blocks)
          if not text:
              text = 'no failure events. stderr tail:\n' + open('/tmp/test.err', encoding='utf-8', errors='replace').read()[-1200:]
          print(f'--- {len(failures)} failure events')
          for i in range(0, len(text), 2800):
              part = text[i:i + 2800].replace('%', '%25').replace('\n', '%0A')
              print(f'::error title=test-{i // 2800 + 1}::{part}')
          PY
          exit 0
