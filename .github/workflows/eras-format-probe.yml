name: ERAS format probe

# TEMPORARY. The authoring sandbox for the keyboard-stability fix has no
# Flutter/Dart toolchain, and its artifact/log download endpoints are
# unreachable, so `dart format` could not be run or read back locally. This
# workflow borrows the CI Flutter SDK: it formats the project, records the
# formatter patch plus `flutter analyze` / `flutter test` output under
# `.probe/`, deletes itself and pushes the result back to the branch with
# `[skip ci]`. The probe directory is removed in the follow-up commit.
on:
  push:
    branches: ["arena/01a0fe8a-emergency-resource-system"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend/emergency_app
        run: flutter pub get

      - name: Format, analyze, test and push the result back
        env:
          WS: ${{ github.workspace }}
        run: |
          mkdir -p "$WS/.probe"
          exec 3>&2
          exec 2> "$WS/.probe/trace.txt"
          set -x
          set +e

          cd "$WS/frontend/emergency_app" || exit 0
          flutter --version > "$WS/.probe/version.txt" 2>&1

          dart format --output=none --set-exit-if-changed . \
            > "$WS/.probe/format-check.txt" 2>&1
          echo "exit=$?" >> "$WS/.probe/format-check.txt"

          dart format . > "$WS/.probe/format-apply.txt" 2>&1
          echo "exit=$?" >> "$WS/.probe/format-apply.txt"

          git -C "$WS" diff > "$WS/.probe/format.patch"

          flutter analyze > "$WS/.probe/analyze.txt" 2>&1
          echo "exit=$?" >> "$WS/.probe/analyze.txt"

          flutter test --reporter expanded > /tmp/test.txt 2>&1
          echo "exit=$?" > "$WS/.probe/test-exit.txt"
          tail -n 1500 /tmp/test.txt > "$WS/.probe/test.txt"
          grep -n -B3 -A45 '\[E\]' /tmp/test.txt \
            > "$WS/.probe/test-errors.txt"
          wc -l /tmp/test.txt > "$WS/.probe/test-lines.txt"

          cd "$WS" || exit 0
          git rm --quiet .github/workflows/eras-format-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short > "$WS/.probe/status.txt" 2>&1
          wc -c "$WS"/.probe/* >> "$WS/.probe/status.txt" 2>&1
          git add -A
          git commit -m "ci: apply dart format and record probe output [skip ci]"
          git push origin HEAD:arena/01a0fe8a-emergency-resource-system

          set +x
          exec 2>&3
          exit 0
