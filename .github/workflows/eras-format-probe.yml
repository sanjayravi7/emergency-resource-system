name: ERAS format probe

# TEMPORARY. The authoring sandbox for the keyboard-stability fix has no
# Flutter/Dart toolchain, and its artifact/log download endpoints are
# unreachable, so `dart format` could not be run or read back locally. This
# workflow borrows the CI Flutter SDK: it formats the project, records the
# formatter patch plus `flutter analyze` / `flutter test` output under
# `.probe/`, deletes itself and pushes the result back to the branch with
# `[skip ci]`. The probe directory is removed in the follow-up commit.
on:
  push:
    branches: ["arena/01a0fe8a-emergency-resource-system"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend/emergency_app
        run: flutter pub get

      - name: Format, analyze and test
        run: |
          set +e
          mkdir -p .probe
          cd frontend/emergency_app

          flutter --version > ../../.probe/version.txt 2>&1

          dart format --output=none --set-exit-if-changed . \
            > ../../.probe/format-check.txt 2>&1
          echo "exit=$?" >> ../../.probe/format-check.txt

          dart format . > ../../.probe/format-apply.txt 2>&1
          echo "exit=$?" >> ../../.probe/format-apply.txt

          # Everything the formatter changed, as an applicable patch.
          git diff > ../../.probe/format.patch

          flutter analyze > ../../.probe/analyze.txt 2>&1
          echo "exit=$?" >> ../../.probe/analyze.txt

          flutter test --reporter expanded > /tmp/test.txt 2>&1
          echo "exit=$?" > ../../.probe/test-exit.txt
          tail -n 2000 /tmp/test.txt > ../../.probe/test.txt
          grep -n -B3 -A45 '\[E\]' /tmp/test.txt \
            > ../../.probe/test-errors.txt || true
          cd ..

          set -e
          wc -c .probe/*

      - name: Push the formatted result and the probe output
        run: |
          git rm --quiet .github/workflows/eras-format-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to push."
            exit 0
          fi
          git commit -m "ci: apply dart format and record probe output [skip ci]"
          git push origin HEAD:arena/01a0fe8a-emergency-resource-system
