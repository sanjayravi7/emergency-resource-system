name: ERAS format probe

# TEMPORARY. The authoring sandbox for the keyboard-stability fix has no
# Flutter/Dart toolchain and cannot download CI logs or artifacts, so this
# workflow is the only way to run the toolchain. It reports:
#   1. baseline  - do the pre-existing auth suites fail on MAIN's auth_shell
#                  too? (attributes failures to this PR or to main)
#   2. overflow  - the full framework dump for the RenderFlex overflow that
#                  ForgotPasswordScreen produces on a 360px viewport
#   3. format / analyze / test on the branch as it stands
# then formats the tree, deletes itself and pushes everything back with
# `[skip ci]`. The `.probe` directory is removed in the follow-up commit.
on:
  push:
    branches: ["arena/01a0fe8a-emergency-resource-system"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend/emergency_app
        run: flutter pub get

      - name: Probe and push the result back
        env:
          WS: ${{ github.workspace }}
          BASE: 4050655
        run: |
          mkdir -p "$WS/.probe"
          exec 3>&2
          exec 2> "$WS/.probe/trace.txt"
          set -x
          set +e

          cd "$WS/frontend/emergency_app" || exit 0
          flutter --version > "$WS/.probe/version.txt" 2>&1

          # ---- 1. baseline: main's auth_shell with the compile fixes -------
          cp lib/widgets/auth_shell.dart /tmp/auth_shell.branch.dart
          mv test/auth_keyboard_composition_test.dart /tmp/
          git show "$BASE:frontend/emergency_app/lib/widgets/auth_shell.dart" \
            > lib/widgets/auth_shell.dart
          flutter test --reporter expanded \
            test/auth_mobile_stability_test.dart \
            test/forgot_password_flow_test.dart \
            test/auth_visual_layout_test.dart \
            > "$WS/.probe/baseline.txt" 2>&1
          echo "baseline_exit=$?" >> "$WS/.probe/baseline.txt"
          git checkout -- lib/widgets/auth_shell.dart
          cp /tmp/auth_shell.branch.dart lib/widgets/auth_shell.dart
          mv /tmp/auth_keyboard_composition_test.dart test/

          # ---- 2. overflow dump (never committed) -------------------------
          cat > test/zz_probe_overflow_test.dart <<'EOF'
          import 'package:dispatch_console_flutter/screens/forgot_password_screen.dart';
          import 'package:dispatch_console_flutter/theme/app_theme.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            testWidgets('dump the ForgotPasswordScreen overflow', (tester) async {
              tester.view.physicalSize = const Size(360, 800);
              tester.view.devicePixelRatio = 1;
              tester.view.padding = FakeViewPadding(top: 24, bottom: 24);
              tester.view.viewPadding = FakeViewPadding(top: 24, bottom: 24);
              addTearDown(tester.view.resetPhysicalSize);
              addTearDown(tester.view.resetDevicePixelRatio);
              addTearDown(tester.view.resetPadding);
              await tester.pumpWidget(MaterialApp(
                theme: erasTheme(Brightness.light),
                home: const ForgotPasswordScreen(),
              ));
              await tester.pumpAndSettle();
            });
          }
          EOF
          flutter test --reporter expanded test/zz_probe_overflow_test.dart \
            > "$WS/.probe/overflow.txt" 2>&1
          echo "overflow_exit=$?" >> "$WS/.probe/overflow.txt"
          rm -f test/zz_probe_overflow_test.dart

          # ---- 3. the real checks ----------------------------------------
          dart format --output=none --set-exit-if-changed . \
            > "$WS/.probe/format-check.txt" 2>&1
          echo "exit=$?" >> "$WS/.probe/format-check.txt"

          dart format . > "$WS/.probe/format-apply.txt" 2>&1
          git -C "$WS" diff > "$WS/.probe/format.patch"

          flutter analyze > "$WS/.probe/analyze.txt" 2>&1
          echo "exit=$?" >> "$WS/.probe/analyze.txt"

          flutter test --reporter expanded > /tmp/test.txt 2>&1
          echo "exit=$?" > "$WS/.probe/test-exit.txt"
          tail -n 1200 /tmp/test.txt > "$WS/.probe/test.txt"
          grep -n -B3 -A45 '\[E\]' /tmp/test.txt \
            > "$WS/.probe/test-errors.txt"
          grep -c '' /tmp/test.txt > "$WS/.probe/test-lines.txt"

          cd "$WS" || exit 0
          git checkout -- frontend/emergency_app/pubspec.lock
          git rm --quiet .github/workflows/eras-format-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short > "$WS/.probe/status.txt" 2>&1
          git add -A
          git commit -m "ci: probe results (baseline, overflow dump, format) [skip ci]"
          git push origin HEAD:arena/01a0fe8a-emergency-resource-system

          set +x
          exec 2>&3
          exit 0
