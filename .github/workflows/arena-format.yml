# TEMPORARY sandbox workflow (arena branch only): applies `dart format` — the
# "Verify formatting" step of dart.yml has never passed on main, so analyze
# and test never run in CI. This sandbox cannot run Flutter, so the bot
# applies the format pass here. Removed before this PR is finalized.
name: Arena Format

on:
  push:
    branches: ["arena/01a0de3c-emergency-resource-system"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/emergency_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply dart format
        run: dart format .

      - name: Commit format changes
        run: |
          git config user.email "arena-debug-bot@users.noreply.github.com"
          git config user.name "arena-debug-bot"
          git add -A
          git diff --cached --quiet || git commit -m "chore: apply dart format" -m "[skip ci]"
          git push
