# TEMPORARY diagnostic workflow for the Google-web-signin fix.
# It posts the exact `dart format` patch plus analyze/test output back to the
# pull request, because this workspace has no local Flutter/Dart toolchain.
# Remove before the change is merged.
name: ERAS web fix probe

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Probe formatting, analysis and tests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          dart format . > /tmp/format.log 2>&1
          git -C "$GITHUB_WORKSPACE" --no-pager diff > /tmp/format.patch
          if [ -s /tmp/format.patch ]; then
            gzip -9 -c /tmp/format.patch | base64 -w0 > /tmp/format.patch.b64
            gh pr comment "$PR_NUMBER" \
              --body "ERAS_FORMAT_PATCH_BEGIN$(cat /tmp/format.patch.b64)" || true
          else
            gh pr comment "$PR_NUMBER" --body "ERAS_FORMAT_PATCH_BEGIN none: dart format made no changes" || true
          fi

          flutter analyze > /tmp/analyze.log 2>&1
          flutter test --reporter expanded > /tmp/test.log 2>&1

          {
            echo "=== dart format ==="
            cat /tmp/format.log
            echo "=== flutter analyze ==="
            head -c 30000 /tmp/analyze.log
            echo "=== flutter test (tail) ==="
            tail -c 500000 /tmp/test.log
          } > /tmp/combined.log
          gzip -9 -c /tmp/combined.log | base64 -w0 > /tmp/combined.b64
          split -b 55000 /tmp/combined.b64 /tmp/part_
          index=0
          for part in /tmp/part_*; do
            index=$((index + 1))
            gh pr comment "$PR_NUMBER" \
              --body "ERAS_PROBE_PART_${index}_BEGIN$(cat "$part")" || true
          done
          echo "probe finished"
