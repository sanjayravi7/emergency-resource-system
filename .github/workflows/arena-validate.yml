# TEMPORARY validation helper for the arena/01a0f8f0 branch.
#
# The development sandbox for this branch cannot reach the Flutter/Dart
# download hosts (or the Actions log storage), so formatting, analysis
# and tests are validated here and the results are committed back to the
# branch as .arena-ci-report.txt. `dart format` fixes are committed back
# automatically as well. This file and the report are removed before the
# branch is merged; dart.yml is untouched and this never runs for main.
name: Arena validate (temporary)

on:
  push:
    branches: ["arena/01a0f8f0-emergency-resource-system"]

permissions:
  contents: write

concurrency:
  group: arena-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate (format + analyze + test)
        id: validate
        run: |
          status=0
          {
            echo "== flutter --version =="
            flutter --version
            echo
            echo "== dart format =="
          } > /tmp/report.txt 2>&1
          dart format . >> /tmp/report.txt 2>&1 || status=1
          echo >> /tmp/report.txt
          echo "== flutter analyze ==" >> /tmp/report.txt
          flutter analyze >> /tmp/report.txt 2>&1 || status=1
          echo >> /tmp/report.txt
          echo "== flutter test (github reporter) ==" >> /tmp/report.txt
          flutter test -r github >> /tmp/report.txt 2>&1 || status=1
          echo >> /tmp/report.txt
          echo "== overall status: $status ==" >> /tmp/report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Publish report and formatting fixes to the branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          cp /tmp/report.txt .arena-ci-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "CI: validation report (temporary)" || true
          git push origin HEAD:${{ github.ref_name }}

      - name: Fail when validation failed
        run: exit ${{ steps.validate.outputs.status }}
