# ---------------------------------------------------------------------------
# TEMPORARY verification workflow - DELETE BEFORE MERGE.
#
# The shared `Flutter` workflow gates `flutter analyze`, `flutter test` and
# `flutter build web` behind `dart format --set-exit-if-changed`, and that
# format step has been failing on `main` since PR #84 (the Dart 3.7+ "tall"
# formatter reformats files that were written with the older style). As a
# result none of the three jobs after it have run on `main` for a while.
#
# This workflow runs the same three steps WITHOUT the format gate, both on
# this branch and on the base commit, so the results can be attributed. The
# output is posted as a PR comment because the sandbox cannot download
# Actions logs.
# ---------------------------------------------------------------------------
name: zz-temp-verify

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify-branch:
    name: verify (branch)
    runs-on: ubuntu-latest
    outputs:
      analyze_exit: ${{ steps.run.outputs.analyze_exit }}
      test_exit: ${{ steps.run.outputs.test_exit }}
      build_exit: ${{ steps.run.outputs.build_exit }}
      report: ${{ steps.run.outputs.report }}
    defaults:
      run:
        working-directory: frontend/emergency_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze / test / build
        id: run
        run: |
          set +e
          flutter analyze > /tmp/analyze.log 2>&1
          ANALYZE_EXIT=$?
          flutter test > /tmp/test.log 2>&1
          TEST_EXIT=$?
          flutter build web --release \
            --dart-define=ERAS_API_BASE_URL=https://eras-api-sdjo.onrender.com/api \
            > /tmp/build.log 2>&1
          BUILD_EXIT=$?
          set -e
          echo "analyze_exit=$ANALYZE_EXIT" >> "$GITHUB_OUTPUT"
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          echo "build_exit=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          {
            echo "## verify (branch ${{ github.head_ref || github.ref_name }})"
            echo "commit: ${{ github.sha }}"
            echo "analyze exit: $ANALYZE_EXIT / test exit: $TEST_EXIT / build exit: $BUILD_EXIT"
            echo
            echo "### flutter analyze"
            echo '```'
            tail -c 8000 /tmp/analyze.log
            echo '```'
            echo
            echo "### flutter test"
            echo '```'
            tail -c 8000 /tmp/test.log
            echo '```'
            echo
            echo "### flutter build web --release"
            echo '```'
            tail -c 3000 /tmp/build.log
            echo '```'
          } > /tmp/report.md
          {
            echo 'report<<ERASEOF'
            cat /tmp/report.md
            echo 'ERASEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Format diff (diagnostic only)
        if: always()
        run: |
          dart format . > /tmp/fmt.out 2>&1 || true
          {
            echo
            echo "### dart format (informational - this repo is already red here on main)"
            echo '```'
            head -3 /tmp/fmt.out
            git --no-pager diff --stat | tail -20
            echo '```'
          } >> /tmp/report.md

      - name: Post report as a PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/report.md || \
            gh issue comment "$PR_NUMBER" \
              --repo "${{ github.repository }}" --body-file /tmp/report.md

  verify-base:
    name: verify (base - main @ 64c0fcc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/emergency_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 64c0fccd54bf95a3dc6bae41238cef23e6e5c585

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze / test on the untouched base commit
        run: |
          set +e
          flutter analyze > /tmp/base_analyze.log 2>&1
          ANALYZE_EXIT=$?
          flutter test > /tmp/base_test.log 2>&1
          TEST_EXIT=$?
          set -e
          {
            echo "## verify (base main @ 64c0fcc) - pre-existing baseline"
            echo "analyze exit: $ANALYZE_EXIT / test exit: $TEST_EXIT"
            echo
            echo "### flutter analyze (base)"
            echo '```'
            tail -c 8000 /tmp/base_analyze.log
            echo '```'
            echo
            echo "### flutter test (base)"
            echo '```'
            tail -c 8000 /tmp/base_test.log
            echo '```'
          } > /tmp/base_report.md

      - name: Post baseline as a PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/base_report.md || \
            gh issue comment "$PR_NUMBER" \
              --repo "${{ github.repository }}" --body-file /tmp/base_report.md
