name: Flutter diagnostics

# TEMPORARY diagnostic workflow (this file will be removed before the fix is
# finalized). It exists purely to capture the full stdout of a failing test:
# `flutter test --reporter=json` routes exception dumps and expect failures
# through "print" events, which the main dart.yml script drops - leaving only
# "Test failed. See exception logs above." with no details.

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests and capture full output
        run: |
          set +e
          flutter test --reporter=json > test-results.json 2> test-stderr.txt
          status=$?
          set -e
          echo "flutter test exit code: $status"
          echo "--- stderr ---"
          cat test-stderr.txt || true
          exit 0

      - name: Annotate failures with captured test output
        run: |
          python3 - <<'PY'
          import json

          names = {}
          prints = {}
          failed = []
          with open('test-results.json', errors='replace') as handle:
              for line in handle:
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  kind = event.get('type')
                  if kind == 'testStart':
                      test = event.get('test', {})
                      names[test.get('id')] = test.get('name', '?')
                  elif kind == 'print':
                      prints.setdefault(event.get('testID'), []).append(
                          str(event.get('message', '')))
                  elif kind == 'error':
                      tid = event.get('testID')
                      if tid not in failed:
                          failed.append(tid)
                      prints.setdefault(tid, []).append(
                          'ERROR EVENT: ' + str(event.get('error', '')))
                  elif kind == 'done':
                      print('suite result:', event.get('success'))

          for tid in failed:
              body = '\n'.join(prints.get(tid, [])) or '(no output captured)'
              body = '{}\n{}'.format(names.get(tid, '?'), body)
              body = body.replace('\n', ' ~ ')
              for index in range(0, min(len(body), 12000), 3000):
                  print('::error::' + body[index:index + 3000])
          PY
