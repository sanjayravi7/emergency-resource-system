name: Temporary Flutter test diagnostics

on:
  pull_request:
    branches: ["main"]

jobs:
  diagnose:
    if: github.head_ref == 'arena/01a0edbd-emergency-resource-system'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/emergency_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run tests with diagnostics
        shell: bash
        run: |
          set +e
          flutter test > test-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('test-output.log').read_text(errors='replace').splitlines()
          failed = []
          for index, line in enumerate(lines):
              if '[E]' in line or 'TestFailure' in line or '══╡ EXCEPTION' in line:
                  failed.extend(lines[max(0, index - 3):min(len(lines), index + 18)])
          text = '\n'.join(failed[-180:] if failed else lines[-180:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error::{text}')
          PY
          fi
          exit "$status"
