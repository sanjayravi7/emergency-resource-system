name: Arena Phase H bootstrap

on:
  push:
    branches:
      - arena/01a0e194-emergency-resource-system

permissions:
  contents: write

jobs:
  flutter-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/emergency_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter clean
      - run: flutter pub get
      - run: dart format --output=none lib test
      - run: flutter analyze
      - name: Flutter full suite run 1
        run: flutter test
      - name: Flutter full suite run 2
        run: flutter test
      - name: Phase H Flutter E2E run 1
        run: flutter test test/e2e/phase_h_workflow_test.dart
      - name: Phase H Flutter E2E run 2
        run: flutter test test/e2e/phase_h_workflow_test.dart
      - name: Phase H Flutter E2E run 3
        run: flutter test test/e2e/phase_h_workflow_test.dart

  prisma-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
      - name: Package Prisma engines and generated runtime
        run: |
          tar -czf /tmp/prisma-runtime.tgz \
            backend/node_modules/@prisma/engines \
            backend/node_modules/.prisma
      - uses: actions/upload-artifact@v4
        with:
          name: prisma-runtime-linux
          path: /tmp/prisma-runtime.tgz
          retention-days: 1
      - name: Publish temporary bootstrap asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phase-h-bootstrap --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create phase-h-bootstrap \
            /tmp/prisma-runtime.tgz \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Phase H temporary bootstrap" \
            --notes "Temporary local verification toolchain; remove after Phase H." \
            --prerelease
      - name: Expose API-accessible chunks for restricted verification sandboxes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          split -b 8m -d -a 2 /tmp/prisma-runtime.tgz /tmp/prisma-part-
          : > /tmp/prisma-chunks.txt
          for part in /tmp/prisma-part-*; do
            sha=$(base64 -w0 "$part" | jq -Rs '{encoding:"base64",content:.}' | gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/git/blobs" \
              --input - \
              --jq .sha)
            echo "PRISMA_CHUNK $(basename "$part") $sha" | tee -a /tmp/prisma-chunks.txt
          done
          gh release edit phase-h-bootstrap \
            --repo "${{ github.repository }}" \
            --notes-file /tmp/prisma-chunks.txt
