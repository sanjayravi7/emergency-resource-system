name: Backend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eras
          POSTGRES_PASSWORD: eras
          POSTGRES_DB: eras_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eras"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI-only credentials for the ephemeral service container above.
      DATABASE_URL: postgresql://eras:eras@localhost:5432/eras_test?schema=public
      # Strong, throwaway CI secret (production secrets live in repo/org secrets).
      JWT_SECRET: ci-only-strong-secret-please-rotate-1234567890-abcdef
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Verify schema
        run: node scripts/verify-schema.js

      - name: Security audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: |
          set -o pipefail
          npm test -- --runInBand 2>&1 | tee /tmp/jest.log && status=0 || status=$?
          set +e
          block=$(grep -a -A 18 '^  ● ' /tmp/jest.log | sed -n '1,400p')
          if [ -n "$block" ]; then
            escaped=$(printf '%s' "$block" | sed -e 's/%/%25/g' | tr '\n' '\001' | sed -e 's/\001/%0A/g')
            echo "::error title=jest-details::$escaped"
          fi
          grep -a -E '^(FAIL|Tests:|Test Suites:)' /tmp/jest.log | while IFS= read -r line; do
            echo "::error title=jest-summary::$line"
          done
          exit "$status"
