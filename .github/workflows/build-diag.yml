name: Release build diagnostics (temporary)

on:
  push:
    branches: ["arena/01a0f9c9-emergency-resource-system"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/emergency_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Build web release
        run: |
          set +e
          flutter build web --release --dart-define=ERAS_API_BASE_URL=https://eras-api-sdjo.onrender.com > /tmp/web.log 2>&1
          status=$?
          tail -6 /tmp/web.log
          body=$(tail -12 /tmp/web.log | tr '\n' ' ' | sed -e 's/%/%25/g')
          echo "::notice title=web-build-exit-$status::$body"
          ls -la build/web/index.html 2>/dev/null
          exit 0

      - name: Build APK release
        run: |
          set +e
          flutter build apk --release --dart-define=ERAS_API_BASE_URL=https://eras-api-sdjo.onrender.com > /tmp/apk.log 2>&1
          status=$?
          tail -8 /tmp/apk.log
          body=$(tail -14 /tmp/apk.log | tr '\n' ' ' | sed -e 's/%/%25/g')
          echo "::notice title=apk-build-exit-$status::$body"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null
          exit 0
