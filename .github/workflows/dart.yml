name: Flutter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Temporary diagnostic artifact. It is removed after the resolved lockfile
      # has been collected for this compatibility repair.
      - name: Upload resolved Flutter lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: frontend/emergency_app/pubspec.lock
          if-no-files-found: error
          retention-days: 1

      - name: Publish resolved lockfile for this diagnostic run
        if: always()
        run: |
          echo "::notice file=frontend/emergency_app/pubspec.lock,line=1,title=Resolved pubspec.lock::$(base64 --wrap=0 frontend/emergency_app/pubspec.lock)"

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        if: always()
        run: flutter analyze

      - name: Run tests
        if: always()
        run: flutter test
