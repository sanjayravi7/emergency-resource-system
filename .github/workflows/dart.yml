name: Flutter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep the Dart formatter/analyzer version deterministic in CI.
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture resolved package lock (temporary)
        run: |
          lock_patch=$(git diff --binary -- pubspec.lock | base64 -w0)
          part=0
          while [ -n "$lock_patch" ]; do
            part=$((part + 1))
            chunk=${lock_patch:0:3000}
            lock_patch=${lock_patch:3000}
            echo "::notice title=PUBSPEC_LOCK_DIFF_${part}::${chunk}"
          done

      - name: Verify Google Maps loader and Places bridge
        run: |
          node tool/eras_google_maps_loader_test.mjs
          node tool/eras_location_bridge_test.mjs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: |
          set +e
          flutter analyze --machine > /tmp/flutter-analyze.txt 2>&1
          analyze_status=$?
          cat /tmp/flutter-analyze.txt
          output=$(base64 -w0 /tmp/flutter-analyze.txt)
          part=0
          while [ -n "$output" ]; do
            part=$((part + 1))
            chunk=${output:0:3000}
            output=${output:3000}
            echo "::notice title=FLUTTER_ANALYZE_${part}::${chunk}"
          done
          exit "$analyze_status"

      - name: Run tests
        run: flutter test

      # Compile check for the deployed artifact. The private Firebase/Google
      # values are supplied by the release helper (tool/build_production_web.sh)
      # at deploy time; this only proves the release web bundle, including the
      # Firebase Auth web sign-in path, still compiles for that command.
      - name: Build release web bundle
        run: >
          flutter build web --release
          --dart-define=ERAS_API_BASE_URL=https://eras-api-sdjo.onrender.com/api
