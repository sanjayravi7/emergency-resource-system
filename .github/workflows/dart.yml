name: Flutter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep the Dart formatter/analyzer version deterministic in CI.
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Google Maps loader and Places bridge
        run: |
          node tool/eras_google_maps_loader_test.mjs
          node tool/eras_location_bridge_test.mjs

      - name: Verify formatting
        run: |
          set +e
          dart format --output=none --set-exit-if-changed . > /tmp/dart-format-check.txt 2>&1
          format_status=$?
          cat /tmp/dart-format-check.txt

          if [ "$format_status" -ne 0 ]; then
            dart format . > /tmp/dart-format-apply.txt 2>&1
            cat /tmp/dart-format-apply.txt
            base64_patch=$(git diff --binary -- . | base64 -w0)
            part=0
            while [ -n "$base64_patch" ]; do
              part=$((part + 1))
              chunk=${base64_patch:0:6000}
              base64_patch=${base64_patch:6000}
              echo "::notice title=DART_FORMAT_DIFF_${part}::${chunk}"
            done
          fi

          exit "$format_status"

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Compile check for the deployed artifact. The private Firebase/Google
      # values are supplied by the release helper (tool/build_production_web.sh)
      # at deploy time; this only proves the release web bundle, including the
      # Firebase Auth web sign-in path, still compiles for that command.
      - name: Build release web bundle
        run: >
          flutter build web --release
          --dart-define=ERAS_API_BASE_URL=https://eras-api-sdjo.onrender.com/api
