name: Flutter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Compile check for the deployed artifact. The private Firebase/Google
      # values are supplied by the release helper (tool/build_production_web.sh)
      # at deploy time; this only proves the release web bundle, including the
      # Firebase Auth web sign-in path, still compiles for that command.
      - name: Build release web bundle
        run: >
          flutter build web --release
          --dart-define=ERAS_API_BASE_URL=https://eras-api-sdjo.onrender.com/api
