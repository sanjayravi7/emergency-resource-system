name: Flutter

# Temporary write access is used only to commit the lockfile generated by the
# Flutter resolver for this repair. This permission and the diagnostic steps
# are removed with the follow-up commit.
permissions:
  contents: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Resolve and commit the lockfile against the PR branch, not GitHub's
          # synthetic pull-request merge ref.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Temporary diagnostic artifact. It is removed after the resolved lockfile
      # has been collected for this compatibility repair.
      - name: Upload resolved Flutter lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: frontend/emergency_app/pubspec.lock
          if-no-files-found: error
          retention-days: 1

      - name: Commit resolved Flutter lockfile
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          git diff --cached --quiet || git commit -m 'chore: resolve Flutter map dependencies'
          git push origin "HEAD:${HEAD_REF}"

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        if: always()
        run: flutter analyze

      - name: Run tests
        if: always()
        run: flutter test
