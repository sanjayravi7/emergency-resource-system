name: Flutter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: |
          set +e
          flutter test --reporter=json > test-results.json
          status=$?
          set -e
          python3 - <<'PY'
          import json

          names = {}
          failures = []
          with open('test-results.json', errors='replace') as handle:
              for line in handle:
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  if event.get('type') == 'testStart':
                      test = event.get('test', {})
                      names[test.get('id')] = test.get('name', '?')
                  elif event.get('type') == 'error':
                      failures.append((
                          names.get(event.get('testID'), '?'),
                          str(event.get('error', '')),
                          str(event.get('stackTrace', '')),
                      ))

          for name, error, stack in failures:
              detail = '{} || {} || {}'.format(name, error, stack)
              detail = detail.replace('\n', ' ~ ')[:4000]
              print('::error::' + detail)
          PY
          exit $status
