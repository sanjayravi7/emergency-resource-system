name: Flutter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: |
          set +e
          flutter test --reporter=json > test-results.json
          status=$?
          set -e
          python3 - <<'PY'
          import json

          names = {}
          prints = {}
          failed = []
          with open('test-results.json', errors='replace') as handle:
              for line in handle:
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  kind = event.get('type')
                  if kind == 'testStart':
                      test = event.get('test', {})
                      names[test.get('id')] = test.get('name', '?')
                  elif kind == 'print':
                      prints.setdefault(event.get('testID'), []).append(
                          str(event.get('message', '')))
                  elif kind == 'error':
                      tid = event.get('testID')
                      if tid not in failed:
                          failed.append(tid)

          for tid in failed:
              body = '\n'.join(prints.get(tid, [])) or '(no output captured)'
              body = '{}\n{}'.format(names.get(tid, '?'), body)
              body = body.replace('\n', ' ~ ')
              for index in range(0, min(len(body), 12000), 3000):
                  print('::error::' + body[index:index + 3000])
          PY
          exit $status
