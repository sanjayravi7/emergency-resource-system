name: Temporary formatter

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'arena/01a0edbd-emergency-resource-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format Dart files
        working-directory: frontend/emergency_app
        run: dart format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/emergency_app
          git commit -m "Apply Dart formatting"
          git push origin HEAD:${{ github.head_ref }}
