name: ERAS branch probe

on:
  push:
    branches:
      - arena/260fe2f4-emergency-resource-system
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Probe formatting (branch)
        run: |
          set +e
          { dart format --output=none --set-exit-if-changed .; echo "format-exit=$?"; } > /tmp/format-check.txt 2>&1
          cat /tmp/format-check.txt

      - name: Probe analyze (branch)
        run: |
          set +e
          { flutter analyze; echo "analyze-exit=$?"; } > /tmp/analyze.txt 2>&1
          cat /tmp/analyze.txt

      - name: Probe tests (branch)
        run: |
          set +e
          { flutter test --reporter expanded; echo "test-exit=$?"; } > /tmp/flutter-test.txt 2>&1
          grep -E "^\s*[0-9].*(\[E\]|All tests passed|Some tests failed)" /tmp/flutter-test.txt | tail -n 60

      - name: Baseline checks on origin/main
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          git fetch --depth=1 origin main
          git worktree add /tmp/main-check origin/main > /dev/null 2>&1
          cd /tmp/main-check/frontend/emergency_app
          { dart format --output=none --set-exit-if-changed .; echo "format-exit=$?"; } > /tmp/main-format.txt 2>&1
          flutter pub get > /tmp/main-pubget.txt 2>&1
          { flutter analyze; echo "analyze-exit=$?"; } > /tmp/main-analyze.txt 2>&1
          cat /tmp/main-format.txt /tmp/main-analyze.txt

      - name: Publish probe logs to probe-logs branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          rm -rf /tmp/probe-out && mkdir -p /tmp/probe-out
          for f in format-check.txt analyze.txt flutter-test.txt main-format.txt main-analyze.txt main-pubget.txt; do
            cp "/tmp/$f" "/tmp/probe-out/$f" 2>/dev/null || true
          done
          cp frontend/emergency_app/pubspec.lock /tmp/probe-out/pubspec.lock
          cd /tmp/probe-out
          git init -q .
          git checkout -q -b probe-logs
          git config user.email "probe@arena.dev"
          git config user.name "arena probe"
          git add -A
          git commit -q -m "probe logs for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/probe-logs
