name: Count diagnostics (temporary)

on:
  push:
    branches: ["arena/01a0f9c9-emergency-resource-system"]

jobs:
  count:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/emergency_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze + test (counted)
        run: |
          set +e
          flutter analyze 2>&1 | tail -3 | tee /tmp/a.txt
          flutter test --reporter expanded 2>&1 | tail -3 | tee /tmp/t.txt
          summary=$(printf 'analyze tail: %s || test tail: %s' "$(cat /tmp/a.txt | tr '\n' ' ')" "$(cat /tmp/t.txt | tr '\n' ' ')")
          esc=$(printf '%s' "$summary" | sed -e 's/%/%25/g')
          echo "::notice title=final-summary::$esc"
          exit 0
