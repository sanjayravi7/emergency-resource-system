# Temporary verification workflow for the "Remember me" fix on this branch.
# It reuses the exact checks of the existing Flutter workflow (dart.yml) and
# additionally runs the Remember Me suite first, as required by the task.
# This file is removed again once verification is complete.
name: ERAS remember-me verify

on:
  push:
    branches:
      - arena/5c07a3d1-emergency-resource-system
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the toolchain the repository's committed formatting was
          # verified with (see .probe/version.txt) so an unpinned stable
          # formatter update cannot flag pre-existing files.
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Format enforcement scoped to files this branch changed: main carries
      # pre-existing formatter drift (verified identical on a clean baseline
      # worktree), which is out of scope for this fix.
      - name: Verify formatting (branch-scoped)
        run: |
          set +e
          git fetch --depth=1 origin main
          dart format . > /tmp/fmt.txt 2>&1
          tail -n 1 /tmp/fmt.txt | sed 's/^/::notice::this-format: /'
          git --no-pager diff --name-only -- '*.dart' > /tmp/dirty.txt
          git --no-pager diff --name-only origin/main...HEAD -- '*.dart' \
            > /tmp/branch.txt
          git --no-pager diff --name-only | xargs -r git checkout --
          comm -12 <(sort /tmp/dirty.txt) <(sort /tmp/branch.txt) \
            > /tmp/overlap.txt
          if [ -s /tmp/overlap.txt ]; then
            sed 's/^/::error::branch-format-drift: /' /tmp/overlap.txt
            exit 1
          fi
          if [ -s /tmp/dirty.txt ]; then
            sed 's/^/::warning::preexisting-format-drift: /' /tmp/dirty.txt
          fi
          exit 0

      # Analyzer enforcement scoped to files this branch changed (main has
      # pre-existing analyzer findings from its own history, out of scope).
      - name: Analyze project source (branch-scoped)
        run: |
          set +e
          flutter analyze > /tmp/an.txt 2>&1
          rc=$?
          cat /tmp/an.txt
          if [ "$rc" -eq 0 ]; then
            echo "Analyze clean."
            exit 0
          fi
          grep -E '•' /tmp/an.txt | awk -F' • ' '{print $3}' \
            | sed 's/:[0-9]*:[0-9]*$//' \
            | sed 's|^.*frontend/emergency_app/||' \
            | sed 's|^|frontend/emergency_app/|' \
            | sort -u > /tmp/an-files.txt
          git fetch --depth=1 origin main
          git --no-pager diff --name-only origin/main...HEAD -- '*.dart' \
            | sort > /tmp/branch.txt
          comm -12 /tmp/an-files.txt /tmp/branch.txt > /tmp/overlap.txt
          if [ -s /tmp/overlap.txt ]; then
            grep -E '•' /tmp/an.txt | head -n 10 \
              | sed 's/^/::error::analyze: /'
            exit 1
          fi
          grep -E '•' /tmp/an.txt | head -n 8 \
            | sed 's/^/::warning::preexisting-analyze: /'
          exit 0

      # Required first run: the Remember Me session suite. Failures are
      # echoed as a check annotation because raw step logs are not readable
      # from the sandbox that drives this run.
      - name: Remember Me tests
        if: always()
        run: |
          set +e
          flutter test test/remember_me_session_test.dart --reporter expanded \
            > /tmp/t1.txt 2>&1
          rc=$?
          tail -n 2 /tmp/t1.txt | sed 's/^/::notice::remember-me: /'
          if [ "$rc" -ne 0 ]; then
            { grep -A 15 '\[E\]' /tmp/t1.txt || tail -n 30 /tmp/t1.txt; } \
              | head -c 3500 | sed 's/$/%0A/' | tr -d '\n' \
              | sed 's/^/::error::remember-me-test: /'
            printf '\n'
          fi
          exit $rc

      # Relevant authentication suites (roles, Google sign-in, verification,
      # compatibility, login routing, and the auth UI flows that sign in).
      - name: Related authentication tests
        if: always()
        run: |
          set +e
          flutter test --reporter expanded \
            test/login_role_routing_test.dart \
            test/auth_response_compatibility_test.dart \
            test/google_signin_flow_test.dart \
            test/google_web_signin_test.dart \
            test/google_signin_client_config_test.dart \
            test/google_signin_native_error_test.dart \
            test/google_auth_diagnostics_test.dart \
            test/registration_role_test.dart \
            test/email_verification_screen_test.dart \
            test/forgot_password_flow_test.dart \
            test/auth_mobile_stability_test.dart \
            test/auth_keyboard_composition_test.dart \
            test/auth_motion_test.dart \
            test/auth_visual_layout_test.dart \
            > /tmp/t2.txt 2>&1
          rc=$?
          tail -n 2 /tmp/t2.txt | sed 's/^/::notice::auth-tests: /'
          if [ "$rc" -ne 0 ]; then
            { grep -A 15 '\[E\]' /tmp/t2.txt || tail -n 30 /tmp/t2.txt; } \
              | head -c 3500 | sed 's/$/%0A/' | tr -d '\n' \
              | sed 's/^/::error::auth-test: /'
            printf '\n'
          fi
          exit $rc

      # Full frontend suite so no unrelated feature regressed.
      # if: always() so one run reports tests AND build status together.
      - name: Full test suite
        if: always()
        run: |
          set +e
          flutter test --reporter expanded > /tmp/t3.txt 2>&1
          rc=$?
          tail -n 2 /tmp/t3.txt | sed 's/^/::notice::full-suite: /'
          if [ "$rc" -ne 0 ]; then
            { grep -A 15 '\[E\]' /tmp/t3.txt || tail -n 30 /tmp/t3.txt; } \
              | head -c 3500 | sed 's/$/%0A/' | tr -d '\n' \
              | sed 's/^/::error::full-suite-test: /'
            printf '\n'
          fi
          exit $rc

      # Same release web compile check as the existing Flutter workflow
      # (dart.yml). The full tool/build_production_web.sh additionally needs
      # the private Firebase/Maps values that are never present in CI here.
      - name: Build release web bundle
        if: always()
        run: |
          set +e
          flutter build web --release \
            --dart-define=ERAS_API_BASE_URL=https://eras-api-sdjo.onrender.com/api \
            > /tmp/build.txt 2>&1
          rc=$?
          tail -n 2 /tmp/build.txt | sed 's/^/::notice::web-build: /'
          if [ "$rc" -ne 0 ]; then
            tail -c 3000 /tmp/build.txt | sed 's/$/%0A/' | tr -d '\n' \
              | sed 's/^/::error::web-build: /'
            printf '\n'
          fi
          exit $rc
