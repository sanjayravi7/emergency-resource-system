name: Auth UI previews

# Temporary development loop for the auth-screen redesign on arena branches:
# verifies formatting/analyze/tests, renders PNG previews of the reference
# design, and publishes everything back to the branch (with [skip ci]) so it
# can be inspected without artifact downloads. Does not run on main.
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare diagnostics directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/ci-diagnostics"
          mkdir -p "$GITHUB_WORKSPACE/ci-diagnostics"

      - name: Check formatting
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dart format --output=none --set-exit-if-changed . 2>&1 | \
            tee "$GITHUB_WORKSPACE/ci-diagnostics/format.txt"

      - name: Analyze project source
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/analyze.txt"

      - name: Run tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/test.txt"

      - name: Capture formatting drift patch
        if: always()
        shell: bash
        run: |
          dart format . > /dev/null 2>&1 || true
          cd "$GITHUB_WORKSPACE"
          git diff > ci-diagnostics/format-drift.patch
          git checkout -- . || true

      - name: Render auth previews
        continue-on-error: true
        shell: bash
        env:
          ERAS_AUTH_PREVIEW: '1'
        run: |
          set -o pipefail
          flutter test test/tools/auth_preview_test.dart --update-goldens \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/previews.txt" || true
          if [ -d test/tools/goldens ]; then
            cp -r test/tools/goldens "$GITHUB_WORKSPACE/ci-diagnostics/previews"
            rm -rf test/tools/goldens
          fi

      - name: Publish diagnostics to the branch
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "arena-preview-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A ci-diagnostics
          git commit -m "[skip ci] dev-loop diagnostics and auth previews" \
            || echo "nothing to publish"
          git push origin "HEAD:${{ github.ref_name }}" \
            || echo "branch moved; skipping publish"
