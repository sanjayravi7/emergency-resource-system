# TEMPORARY helper: applies `dart format` in CI and pushes the result back so
# the exact formatter diff can be inspected, because the workspace where this
# change was written cannot run the Flutter toolchain.
#
# Pushes use GITHUB_TOKEN, which does not re-trigger workflows, so this cannot
# loop. It is deleted again in the following commit.
name: ERAS format fix (temporary)

on:
  push:
    branches: ["arena/01a102eb-emergency-resource-system"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a102eb-emergency-resource-system

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend/emergency_app

      - name: Format
        run: dart format .
        working-directory: frontend/emergency_app

      - name: Push the formatted result
        run: |
          set -e
          git --no-pager diff --stat -- 'frontend/emergency_app/**/*.dart' || true
          if [ -n "$(git status --porcelain -- 'frontend/emergency_app/lib' 'frontend/emergency_app/test')" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add frontend/emergency_app/lib frontend/emergency_app/test
            git commit -m 'chore(format): apply dart format output'
            git push
          else
            echo 'already formatted'
          fi
