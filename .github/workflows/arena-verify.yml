name: Arena verification (temporary)

# Temporary helper workflow used to run the Flutter toolchain for the
# arena/* working branch and report the raw output back as a commit comment.
# It is removed again before the branch is finished.

on:
  push:
    branches: ["arena/**"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run checks
        run: |
          REPORT=/tmp/report.md
          : > "$REPORT"

          run_step() {
            title="$1"
            shift
            {
              echo "### $title"
              echo '```'
            } >> "$REPORT"
            set +e
            "$@" > /tmp/step.log 2>&1
            code=$?
            set -e
            tail -c 7000 /tmp/step.log >> "$REPORT"
            {
              echo ""
              echo "EXIT CODE: $code"
              echo '```'
              echo ""
            } >> "$REPORT"
          }

          run_step "flutter --version" flutter --version
          run_step "flutter pub get" flutter pub get
          run_step "dart format --output=none --set-exit-if-changed ." \
            dart format --output=none --set-exit-if-changed .
          run_step "flutter analyze" flutter analyze
          run_step "flutter test test/requester_location_test.dart" \
            flutter test test/requester_location_test.dart
          run_step "flutter test" flutter test

      - name: Formatter diff
        if: always()
        run: |
          REPORT=/tmp/report.md
          set +e
          dart format . > /tmp/format.log 2>&1
          {
            echo "### dart format . output"
            echo '```'
            tail -c 1500 /tmp/format.log
            echo '```'
            echo "### git diff --stat after dart format"
            echo '```'
            git diff --stat | tail -c 3000
            echo '```'
          } >> "$REPORT"
          git diff > /tmp/format.patch
          gzip -9 -c /tmp/format.patch | base64 -w 200 > /tmp/format.patch.b64
          git checkout -- .

      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          post() {
            head -c 60000 "$1" > /tmp/body.txt
            jq -Rs '{body: .}' < /tmp/body.txt > /tmp/payload.json
            gh api -X POST \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              --input /tmp/payload.json --jq '.html_url'
          }
          post /tmp/report.md
          post /tmp/format.patch.b64
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
