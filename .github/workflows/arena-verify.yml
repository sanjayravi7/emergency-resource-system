name: Arena verification (temporary)

on:
  push:
    branches: ["arena/01a0dcd4-emergency-resource-system"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run everything and collect a report
        run: |
          set +e
          report=/tmp/report.md
          : > "$report"

          echo '### flutter --version' >> "$report"
          echo '```' >> "$report"; flutter --version >> "$report" 2>&1; echo '```' >> "$report"

          echo '### flutter pub get' >> "$report"
          echo '```' >> "$report"; flutter pub get >> "$report" 2>&1; echo "exit=$?" >> "$report"; echo '```' >> "$report"

          echo '### flutter analyze' >> "$report"
          echo '```' >> "$report"; flutter analyze >> "$report" 2>&1; echo "exit=$?" >> "$report"; echo '```' >> "$report"

          echo '### flutter test test/requester_location_test.dart' >> "$report"
          echo '```' >> "$report"; flutter test test/requester_location_test.dart >> "$report" 2>&1; echo "exit=$?" >> "$report"; echo '```' >> "$report"

          echo '### flutter test' >> "$report"
          echo '```' >> "$report"; flutter test >> "$report" 2>&1; echo "exit=$?" >> "$report"; echo '```' >> "$report"

          echo '### dart format --output=none --set-exit-if-changed .' >> "$report"
          echo '```' >> "$report"; dart format --output=none --set-exit-if-changed . >> "$report" 2>&1; echo "exit=$?" >> "$report"; echo '```' >> "$report"

          echo '### dart format diff for the two touched files' >> "$report"
          dart format lib/services/location_service_web.dart test/requester_location_test.dart > /dev/null 2>&1
          echo '```diff' >> "$report"
          git diff -- lib/services/location_service_web.dart test/requester_location_test.dart >> "$report" 2>&1
          echo '```' >> "$report"
          git checkout -- lib/services/location_service_web.dart test/requester_location_test.dart

          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/body.json
          import json
          body = open('/tmp/report.md').read()[:60000]
          print(json.dumps({"body": body}))
          PY
          gh api --method POST \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input /tmp/body.json > /dev/null
