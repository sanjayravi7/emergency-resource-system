name: Arena verification (temporary)

on:
  push:
    branches: ["arena/01a0dcd4-emergency-resource-system"]

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/emergency_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        if: always()
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/analyze.txt
          code=${PIPESTATUS[0]}
          {
            echo '## flutter analyze'
            echo '```'
            cat /tmp/analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Run requester location tests
        if: always()
        run: flutter test test/requester_location_test.dart

      - name: Run all tests
        if: always()
        run: flutter test

      - name: Formatting report (informational)
        if: always()
        run: |
          set +e
          dart format --output=none --set-exit-if-changed . 2>&1 | tee /tmp/fmt.txt
          code=${PIPESTATUS[0]}
          {
            echo "## dart format (exit $code)"
            echo '```'
            tail -60 /tmp/fmt.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
